name: Release

# Push a tag like v0.2.0 and this tests, signs and uploads the release to
# the Maven Central Portal. It stops there on purpose: a Maven Central
# release can never be deleted, so a person reviews the deployment and
# clicks Publish in the portal. See RELEASING.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          # Writes ~/.m2/settings.xml with a `central` server whose
          # credentials come from these environment variables.
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Tag matches the project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "$tag" != "$code" ]; then
            echo "::error::Tag v$tag does not match the project version ($code)."
            exit 1
          fi

      # The GPG plugin's built-in signer reads the key and passphrase from
      # MAVEN_GPG_KEY and MAVEN_GPG_PASSPHRASE, so no gpg program, keyring
      # or passphrase prompt is involved.
      - name: Test, sign and upload to the Central Portal
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw -B -P release -Dgpg.signer=bc deploy

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            core/target/zevauth-java-*.jar \
            spring-boot-starter/target/zevauth-spring-boot-starter-*.jar \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag \
            --notes "Uploaded to the Maven Central Portal. It appears on Maven Central once the deployment is published there."
